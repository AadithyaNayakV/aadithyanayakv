<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a16"/>
      <stop offset="100%" stop-color="#141228"/>
    </linearGradient>

    <!-- Monogram Gradient (Cyan to Electric Violet) -->
    <linearGradient id="anv-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Cybernetic Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2.5"/>

  <!-- Top Accent Dot -->
  <circle cx="32" cy="11" r="2" fill="#22d3ee"/>

  <!-- Bold High-Contrast ANV Monogram -->
  <text 
    x="32" 
    y="39" 
    text-anchor="middle" 
    dominant-baseline="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', Inter, sans-serif" 
    font-weight="900" 
    font-size="22" 
    letter-spacing="0.5px" 
    fill="url(#anv-brand)"
    filter="url(#glow)"
  >ANV</text>

  <!-- Bottom Accent Underline Bar -->
  <line x1="20" y1="49" x2="44" y2="49" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
</svg>